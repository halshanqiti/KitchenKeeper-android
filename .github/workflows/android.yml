name: Build Kitchenkeeper Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the Android project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install the selected platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check and build the personal-install APK
        run: gradle --no-daemon --stacktrace lintDebug assembleDebug
      - name: Prepare verification output
        run: mkdir -p deliverables
      - name: Verify the APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > deliverables/SIGNATURE.txt'
      - name: Prepare the Android download
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/Kitchenkeeper-personal.apk
          cp README.md deliverables/README.md
          python3 - <<'PYCODE'
          import json, os, pathlib
          data = {'repository': os.environ['GITHUB_REPOSITORY'], 'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'package': 'com.kitchenkeeper.android.personal', 'min_sdk': 26, 'target_sdk': 36, 'signing': 'development debug key', 'device_tested': False}
          pathlib.Path('deliverables/BUILD-INFO.json').write_text(json.dumps(data, indent=2) + '\n')
          PYCODE
          cd deliverables
          sha256sum Kitchenkeeper-personal.apk > SHA256SUMS.txt
      - name: Save the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Kitchenkeeper-Android-APK
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
