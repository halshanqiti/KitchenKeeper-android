name: Build Kitchenkeeper Native Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle', 'gradle.properties', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile native app and run Android lint
        run: gradle --no-daemon --stacktrace lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native screens, persistence, OCR and encrypted keys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 420
            gradle --no-daemon connectedDebugAndroidTest
            mkdir -p deliverables/screenshots
            adb pull /sdcard/Android/data/com.kitchenkeeper.android/files/screenshots/. deliverables/screenshots/
      - name: Package verified unsigned release for private signing
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/release/app-release-unsigned.apk deliverables/Kitchenkeeper-native-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 deliverables/Kitchenkeeper-native-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" deliverables/apksigner.jar
          cp README.md deliverables/README.md
          python3 - <<'PYCODE'
          import json, os, pathlib
          data = {'repository': os.environ['GITHUB_REPOSITORY'], 'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'package': 'com.kitchenkeeper.android', 'version': '2.0', 'min_sdk': 26, 'target_sdk': 36, 'ui': 'native Android views, no WebView or Custom Tabs', 'emulator_tested': True, 'physical_device_tested': False, 'signing': 'unsigned artifact; private signing required'}
          pathlib.Path('deliverables/BUILD-INFO.json').write_text(json.dumps(data, indent=2) + '\n')
          PYCODE
          cd deliverables
          sha256sum Kitchenkeeper-native-unsigned.apk apksigner.jar > SHA256SUMS.txt
      - name: Save native build
        uses: actions/upload-artifact@v4
        with:
          name: Kitchenkeeper-Native-Android
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kitchenkeeper-Native-Test-Reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 30
